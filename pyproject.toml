[project]
name = "openarm_mjlab"
version = "0.1.0"
authors = [{ name = "Enactic, Inc." }]
description = "PPO manipulation tasks for the OpenArm bimanual robot on mjlab"
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "openarm-mujoco",
  "mjlab>=1.5.0",
]

[project.urls]
Changelog = "https://github.com/enactic/openarm_mjlab/releases"
Issues = "https://github.com/enactic/openarm_mjlab/issues"
Repository = "https://github.com/enactic/openarm_mjlab"

[project.scripts]
openarm-mjlab-multitask-train = "openarm_mjlab.multitask_train:main"
openarm-mjlab-play = "openarm_mjlab.play:main"
openarm-mjlab-train = "openarm_mjlab.train:main"

[dependency-groups]
dev = [
  "ruff==0.14.11", # sync with .pre-commit-config.yaml
  "pytest>=8.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
extend-select = [
  "D",   # pydocstyle
  "UP"
]

[tool.ruff.lint.per-file-ignores]
"!src/**.py" = ["D"]
